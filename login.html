<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brightloop Subscription Management System</title>
  <style>
    :root {
      --bg-color: #f8f5fc;
      --card-bg: #ffffff;
      --primary-lilac: #9b72cf;
      --primary-hover: #8655c6;
      --light-lilac: #f3ebfc;
      --accent-glow: rgba(155, 114, 207, 0.25);
      --text-dark: #2d2638;
      --text-muted: #7a7289;
      --border-color: #e6ddf2;
      --success-green: #2e7d32;
      --warning-orange: #ed6c02;
      --danger-red: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* -------------------------------------------------------------
       INTERFACE 1: SPLASH SCREEN (7 Seconds Auto Transition)
    ------------------------------------------------------------- */
    #splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background: linear-gradient(135deg, #ffffff 0%, var(--light-lilac) 100%);
      z-index: 100;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo-mark {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 6px solid var(--primary-lilac);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      background: #ffffff;
      box-shadow: 0 0 30px var(--accent-glow);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); box-shadow: 0 0 15px var(--accent-glow); }
      100% { transform: scale(1.05); box-shadow: 0 0 35px rgba(155, 114, 207, 0.4); }
    }

    .logo-mark-inner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--primary-lilac);
    }

    .app-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #2d2638, var(--primary-hover));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .progress-bar-container {
      width: 180px;
      height: 6px;
      background-color: var(--border-color);
      border-radius: 3px;
      margin-top: 35px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-lilac), var(--primary-hover));
      border-radius: 3px;
      /* Set exactly to 7 seconds duration */
      animation: fillProgress 7s linear forwards;
    }

    @keyframes fillProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* -------------------------------------------------------------
       INTERFACE 2: LOGIN SCREEN
    ------------------------------------------------------------- */
    #login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: radial-gradient(circle at top right, var(--light-lilac), transparent 50%),
                  radial-gradient(circle at bottom left, #f3ebfc, transparent 50%);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 44px 36px;
      box-shadow: 0 20px 40px rgba(155, 114, 207, 0.12);
      text-align: center;
      transform: translateY(0);
      transition: transform 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-3px);
    }

    .login-logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .login-logo-mark {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 5px solid var(--primary-lilac);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      background: var(--light-lilac);
    }

    .login-logo-mark-inner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: var(--primary-lilac);
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
